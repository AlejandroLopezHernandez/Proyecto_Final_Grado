<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restaurante El Cañaveral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="css/cartaStyle.css">
</head>
<body>
    <div class="menu-container">
        <div class="header">
            <div class="fecha">{{ fecha }}</div>
            <h1>Restaurante El Cañaveral</h1>
            <p>Carta de Comidas y Bebidas</p>
            <a href="/reservas/nueva" id="boton-reserva" class="btn btn-success">Reservar mesa</a>
        </div>
        <div class="menu-content">
            <div class="section">
                <h2 class="section-title">Comida</h2>
                {{ secciones_comida }}
            </div>
            <div class="section">
                <h2 class="section-title">Bebidas</h2>
                {{ secciones_bebida }}
            </div>
        </div>
        <div class="footer">Gracias por su visita</div>
    </div>
</body>
</html>
